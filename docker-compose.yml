services:
    dome:
        build: .
        container_name: dome-app
        command: server
        volumes:
            - .:/app
            - dome_data:/app/data
        ports:
            - "8000:8000"
        environment:
            - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1

    rustfs:
        image: rustfs/rustfs:latest
        container_name: dome-rustfs
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - rustfs_data:/data

volumes:
    rustfs_data:
    dome_data:
